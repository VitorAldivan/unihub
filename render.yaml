services:
  - type: web
    name: unihub-api
    runtime: python
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir apps/api
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
